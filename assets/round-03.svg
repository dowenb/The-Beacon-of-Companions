<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A hungry village shares a communal meal around a warm fire at dusk">
  <defs>
    <radialGradient id="plateVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#0c1320" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c1320" stop-opacity="0.28"/>
    </radialGradient>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e79b6a"/><stop offset=".55" stop-color="#a36e8c"/><stop offset="1" stop-color="#59527f"/></linearGradient>
    <radialGradient id="fireglow"><stop stop-color="#ffd878" stop-opacity=".75"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="682" cy="92" r="30" fill="#ffe3b0" opacity=".9"/>
  <path d="M0 250 Q140 212 280 244 T560 230 T800 246 V450 H0Z" fill="#4a4763" opacity=".8"/>
  <path d="M0 292 Q200 262 400 290 T800 280 V450 H0Z" fill="#3d4a44"/>
  <!-- houses -->
  <g>
    <g fill="#3b3a46" stroke="#292832" stroke-width="2">
      <rect x="70" y="240" width="86" height="66"/><rect x="190" y="262" width="64" height="46"/>
      <rect x="546" y="252" width="76" height="56"/><rect x="660" y="268" width="68" height="42"/>
    </g>
    <g fill="#a8613f">
      <path d="M62 240 L113 206 L164 240Z"/><path d="M182 262 L222 236 L262 262Z"/>
      <path d="M538 252 L584 220 L630 252Z"/><path d="M652 268 L694 244 L736 268Z"/>
    </g>
    <g fill="#ffd98a" opacity=".9">
      <rect x="92" y="264" width="18" height="18"/><rect x="566" y="272" width="16" height="16"/>
      <rect x="678" y="282" width="14" height="14"/>
    </g>
  </g>
  <!-- fire glow -->
  <ellipse cx="400" cy="368" rx="190" ry="120" fill="url(#fireglow)"/>
  <g>
    <path d="M400 392 Q370 350 388 316 Q392 338 404 340 Q414 310 412 288 Q440 330 420 392Z" fill="#f2883c"/>
    <path d="M400 390 Q386 360 398 336 Q408 356 414 336 Q426 364 410 390Z" fill="#ffd36b"/>
    <g stroke="#7a5232" stroke-width="7" stroke-linecap="round"><path d="M366 396 L432 376"/><path d="M370 378 L430 396"/></g>
    <ellipse cx="400" cy="402" rx="46" ry="10" fill="#5a3a28" opacity=".6"/>
  </g>
  <!-- villagers around the fire -->
  <g>
    <g transform="translate(300 390)"><ellipse cy="3" rx="16" ry="4" fill="#000" opacity=".25"/><path d="M0-32 C10-32 15-14 17 0 L-17 0 C-15-14 -10-32 0-32Z" fill="#7d6b4d"/><circle cx="0" cy="-38" r="7" fill="#d9a87e"/></g>
    <g transform="translate(354 414)"><ellipse cy="3" rx="16" ry="4" fill="#000" opacity=".25"/><path d="M0-30 C9-30 14-13 16 0 L-16 0 C-14-13 -9-30 0-30Z" fill="#8a5f45"/><circle cx="0" cy="-36" r="7" fill="#d9a87e"/></g>
    <g transform="translate(446 414)"><ellipse cy="3" rx="16" ry="4" fill="#000" opacity=".25"/><path d="M0-30 C9-30 14-13 16 0 L-16 0 C-14-13 -9-30 0-30Z" fill="#5e6f7c"/><circle cx="0" cy="-36" r="7" fill="#d9a87e"/></g>
    <g transform="translate(500 390)"><ellipse cy="3" rx="16" ry="4" fill="#000" opacity=".25"/><path d="M0-32 C10-32 15-14 17 0 L-17 0 C-15-14 -10-32 0-32Z" fill="#3f6180"/><circle cx="0" cy="-38" r="7" fill="#d9a87e"/></g>
    <g transform="translate(400 430)"><path d="M0-28 C8-28 12-12 14 0 L-14 0 C-12-12 -8-28 0-28Z" fill="#77724f"/><circle cx="0" cy="-34" r="6.5" fill="#d9a87e"/></g>
  </g>
  <!-- bowls -->
  <g fill="#e8d6b0" stroke="#9a7b52" stroke-width="2">
    <ellipse cx="326" cy="384" rx="12" ry="5"/><ellipse cx="474" cy="384" rx="12" ry="5"/>
  </g>
  <rect width="800" height="450" fill="url(#plateVignette)" pointer-events="none"/>
</svg>
