<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Travelers lift a fallen boulder to free a stranded knight on a mountain pass">
  <defs>
    <radialGradient id="plateVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#0c1320" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c1320" stop-opacity="0.28"/>
    </radialGradient>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b9d2df"/><stop offset="1" stop-color="#e8dcc6"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="666" cy="96" r="34" fill="#fff4d4" opacity=".9"/>
  <path d="M0 250 L140 140 L250 230 L360 120 L470 236 L600 128 L800 260 V450 H0Z" fill="#7f939b"/>
  <path d="M140 140 L166 172 L120 172Z M360 120 L390 158 L336 158Z M600 128 L628 166 L574 166Z" fill="#eef2ef" opacity=".85"/>
  <path d="M0 310 L160 236 L300 300 L440 220 L600 300 L800 244 V450 H0Z" fill="#5e726d"/>
  <path d="M0 360 Q200 330 400 356 T800 344 V450 H0Z" fill="#435a54"/>
  <!-- snowy pass above -->
  <path d="M620 226 Q700 196 800 214 V280 Q700 258 620 286Z" fill="#e6eee9" opacity=".8"/>
  <!-- boulder -->
  <path d="M180 356 Q168 292 222 274 Q290 262 320 306 Q344 348 306 374 Q236 392 180 356Z" fill="#7d8680" stroke="#5c665f" stroke-width="3"/>
  <path d="M222 274 Q244 300 230 326 M270 282 Q286 310 276 340" stroke="#9aa49a" stroke-width="3" fill="none" opacity=".6"/>
  <!-- knight beneath the rock -->
  <g transform="translate(268 372)">
    <path d="M-16 6 Q-18 -22 0 -28 Q18 -22 16 6Z" fill="#9fb0bd" stroke="#6c7d8b" stroke-width="2"/>
    <rect x="-9" y="-26" width="18" height="12" rx="3" fill="#7d8f9e"/>
    <path d="M-9 -20 H9" stroke="#3d4a56" stroke-width="3"/>
    <path d="M14 -14 L30 -26" stroke="#9fb0bd" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- lever -->
  <path d="M150 356 L306 306" stroke="#8c6239" stroke-width="9" stroke-linecap="round"/>
  <path d="M296 308 L318 300" stroke="#6a4a2b" stroke-width="12" stroke-linecap="round"/>
  <!-- helpers -->
  <g data-party="friends" transform="translate(120 372)"><ellipse cy="3" rx="17" ry="4" fill="#000" opacity=".22"/><path d="M0-34 C11-34 16-15 18 0 L-18 0 C-16-15 -11-34 0-34Z" fill="#9a6a45"/><circle cx="0" cy="-40" r="7.5" fill="#d9a87e"/><path d="M14-26 L26-34" stroke="#d9a87e" stroke-width="5" stroke-linecap="round"/></g>
  <g data-party="friends" transform="translate(72 382)"><ellipse cy="3" rx="15" ry="4" fill="#000" opacity=".2"/><path d="M0-30 C9-30 14-13 16 0 L-16 0 C-14-13 -9-30 0-30Z" fill="#5e7086"/><circle cx="0" cy="-36" r="7" fill="#d9a87e"/></g>
  <g data-party="friends" transform="translate(366 372)"><ellipse cy="3" rx="16" ry="4" fill="#000" opacity=".22"/><path d="M0-32 C10-32 15-14 17 0 L-17 0 C-15-14 -10-32 0-32Z" fill="#4d6b82"/><circle cx="0" cy="-38" r="7" fill="#d9a87e"/><path d="M-14-24 L-30-32" stroke="#d9a87e" stroke-width="5" stroke-linecap="round"/></g>
  <!-- blacksmith with hammer -->
  <g data-party="friends" transform="translate(430 380)"><ellipse cy="3" rx="16" ry="4" fill="#000" opacity=".2"/><path d="M0-32 C10-32 15-14 17 0 L-17 0 C-15-14 -10-32 0-32Z" fill="#7a5a42"/><circle cx="0" cy="-38" r="7" fill="#d9a87e"/><path d="M12-24 L30-40" stroke="#d9a87e" stroke-width="5" stroke-linecap="round"/><rect x="26" y="-46" width="14" height="7" rx="2" fill="#8e969a" transform="rotate(-40 33 -42)"/></g>
  <!-- solitary path onward -->
  <path d="M560 420 Q640 380 760 366" stroke="#d8d0b8" stroke-width="7" stroke-dasharray="14 12" stroke-linecap="round" fill="none" opacity=".4"/>
  <rect width="800" height="450" fill="url(#plateVignette)" pointer-events="none"/>
</svg>
