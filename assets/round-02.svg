<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Travelers build a raft together at a high river while a lone figure eyes the stepping stones">
  <defs>
    <radialGradient id="plateVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#0c1320" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c1320" stop-opacity="0.28"/>
    </radialGradient>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cfe4e6"/><stop offset="1" stop-color="#8fb3bf"/></linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5c9bb0"/><stop offset="1" stop-color="#316b86"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="132" cy="86" r="38" fill="#fff3ce" opacity=".85"/>
  <path d="M0 210 Q130 166 260 204 T520 190 T800 208 V262 H0Z" fill="#7fa39a" opacity=".8"/>
  <path d="M0 244 Q180 214 360 240 T800 232 V300 H0Z" fill="#5f8574"/>
  <rect x="0" y="286" width="800" height="164" fill="url(#river)"/>
  <g stroke="#bfe0e6" stroke-width="3" opacity=".45" fill="none">
    <path d="M20 330 Q70 322 120 330 T220 330"/><path d="M420 372 Q470 364 520 372 T620 372"/>
    <path d="M180 408 Q240 398 300 408 T420 408"/><path d="M560 320 Q610 312 660 320 T760 320"/>
  </g>
  <!-- raft -->
  <g transform="translate(268 336)">
    <g transform="rotate(-5)">
      <rect x="-78" y="-8" width="156" height="16" rx="8" fill="#a4774a" stroke="#6d4b2e" stroke-width="3"/>
      <rect x="-78" y="10" width="156" height="16" rx="8" fill="#b78855" stroke="#6d4b2e" stroke-width="3"/>
      <path d="M-60 -10 L-60 28 M60 -10 L60 28" stroke="#7a5232" stroke-width="4"/>
      <path d="M-40 -14 Q0 -30 40 -14" stroke="#e4d2a6" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(-34 -22)">
      <path d="M0-30 C9-30 13-13 15 0 L-15 0 C-13-13 -9-30 0-30Z" fill="#4d6f86"/>
      <circle cx="0" cy="-36" r="7" fill="#e3b68c"/>
    </g>
    <g transform="translate(12 -26)">
      <path d="M0-32 C9-32 14-13 16 0 L-16 0 C-14-13 -9-32 0-32Z" fill="#9a6a45"/>
      <circle cx="0" cy="-38" r="7" fill="#e3b68c"/>
      <path d="M14-24 L30-38" stroke="#e3b68c" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(52 -20)">
      <path d="M0-28 C8-28 12-12 14 0 L-14 0 C-12-12 -8-28 0-28Z" fill="#6d7f5a"/>
      <circle cx="0" cy="-34" r="6.5" fill="#e3b68c"/>
    </g>
    <circle cx="-58" cy="-26" r="12" fill="#ffd77a" opacity=".9"/>
    <circle cx="-58" cy="-26" r="26" fill="#ffd77a" opacity=".22"/>
  </g>
  <!-- stepping stones -->
  <g fill="#7b8c86" stroke="#4f605c" stroke-width="2">
    <ellipse cx="470" cy="352" rx="24" ry="10"/>
    <ellipse cx="536" cy="334" rx="21" ry="9"/>
    <ellipse cx="600" cy="314" rx="19" ry="8"/>
    <ellipse cx="660" cy="292" rx="17" ry="7"/>
    <ellipse cx="716" cy="270" rx="15" ry="6"/>
  </g>
  <!-- lone figure on the first stone -->
  <g transform="translate(470 344)">
    <ellipse cy="6" rx="16" ry="4" fill="#000" opacity=".2"/>
    <path d="M0-34 C10-34 15-14 18 0 L-18 0 C-15-14 -10-34 0-34Z" fill="#3d4a5c"/>
    <circle cx="0" cy="-40" r="7.5" fill="#ddb08a"/>
    <path d="M-8-42 Q0-53 8-42 L8-38 Q0-46 -8-38Z" fill="#2a3442"/>
  </g>
  <!-- far bank -->
  <path d="M744 274 Q780 260 800 268 V320 H744Z" fill="#6d8a6c"/>
  <rect width="800" height="450" fill="url(#plateVignette)" pointer-events="none"/>
</svg>
