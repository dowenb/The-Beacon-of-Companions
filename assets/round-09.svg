<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Companions share the weight of a torch on the final spiral stair while a lone figure races ahead">
  <defs>
    <radialGradient id="plateVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#0c1320" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c1320" stop-opacity="0.28"/>
    </radialGradient>

    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5a5346"/><stop offset="1" stop-color="#2e2d2f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ffd989" stop-opacity=".75"/><stop offset="1" stop-color="#f0a94e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#wall)"/>
  <!-- spiral stairwell -->
  <path d="M0 90 Q400 30 800 130 V170 Q400 70 0 130Z" fill="#453f36" opacity=".9"/>
  <path d="M0 190 Q400 130 800 230 V270 Q400 170 0 230Z" fill="#403a32" opacity=".9"/>
  <path d="M0 300 Q400 240 800 340 V380 Q400 280 0 340Z" fill="#39342e" opacity=".9"/>
  <!-- central pillar -->
  <ellipse cx="400" cy="450" rx="92" ry="70" fill="#4a4338"/>
  <ellipse cx="400" cy="430" rx="92" ry="34" fill="#5b5346"/>
  <!-- torch carried together -->
  <g transform="translate(330 300)">
    <circle r="86" fill="url(#glow)"/>
    <path d="M0 8 L60 -46" stroke="#7a5432" stroke-width="9" stroke-linecap="round"/>
    <path d="M58 -48 Q46 -74 60 -92 Q66 -76 74 -84 Q82 -66 68 -44Z" fill="#f6a94b"/>
    <path d="M60 -50 Q54 -68 64 -80 Q72 -66 70 -50Z" fill="#ffe09a"/>
  </g>
  <!-- hands and companions lifting -->
  <g>
    <g data-party="friends" transform="translate(250 336)"><ellipse cy="3" rx="16" ry="4" fill="#000" opacity=".25"/><path d="M0-32 C10-32 15-14 17 0 L-17 0 C-15-14 -10-32 0-32Z" fill="#4d6f86"/><circle cx="0" cy="-38" r="7" fill="#d9a87e"/><path d="M14-24 L34-34" stroke="#d9a87e" stroke-width="5" stroke-linecap="round"/></g>
    <g data-party="friends" transform="translate(300 372)"><ellipse cy="3" rx="16" ry="4" fill="#000" opacity=".25"/><path d="M0-30 C9-30 14-13 16 0 L-16 0 C-14-13 -9-30 0-30Z" fill="#8a6a49"/><circle cx="0" cy="-36" r="7" fill="#d9a87e"/><path d="M12-22 L30-30" stroke="#d9a87e" stroke-width="5" stroke-linecap="round"/></g>
    <g data-party="friends" transform="translate(392 386)"><ellipse cy="3" rx="16" ry="4" fill="#000" opacity=".25"/><path d="M0-30 C9-30 14-13 16 0 L-16 0 C-14-13 -9-30 0-30Z" fill="#77875c"/><circle cx="0" cy="-36" r="7" fill="#d9a87e"/></g>
    <g data-party="gorin" transform="translate(440 366)"><ellipse cy="3" rx="16" ry="4" fill="#000" opacity=".25"/><path d="M0-30 C9-30 14-13 16 0 L-16 0 C-14-13 -9-30 0-30Z" fill="#7a5a42"/><circle cx="0" cy="-36" r="7" fill="#d9a87e"/><path d="M-12-22 L-28-34" stroke="#d9a87e" stroke-width="5" stroke-linecap="round"/></g>
  </g>
  <!-- Pip at heel -->
  <g data-party="pip" transform="translate(212 366)">
    <ellipse cx="0" cy="14" rx="25" ry="4" fill="#000" opacity=".2"/>
    <path d="M-12 6 V14 M-2 6 V14 M8 6 V14" stroke="#a85c31" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M10 2 Q26 -4 31 -20 Q35 -8 27 3 Q20 10 9 8Z" fill="#cf753f"/>
    <path d="M31 -20 Q35 -8 27 3 Q32 -9 31 -20Z" fill="#f7e8d2"/>
    <ellipse cx="-2" cy="2" rx="15" ry="8" fill="#d88049"/>
    <path d="M-13 5 Q-2 12 10 5 Q-2 10 -13 5Z" fill="#f5dfc2"/>
    <path d="M-18 -6 Q-11 -14 -2 -10 Q4 -5 2 2 Q-3 8 -12 6 Q-20 2 -18 -6Z" fill="#dc874f"/>
    <path d="M-18 -2 Q-27 -1 -31 3 Q-25 8 -16 6Z" fill="#efad7b"/>
    <circle cx="-31" cy="3" r="2" fill="#2b2018"/>
    <path d="M-16 -10 L-19 -23 L-8 -12Z" fill="#b96435"/>
    <path d="M-6 -12 L-2 -23 L5 -10Z" fill="#b96435"/>
    <path d="M-16 -12 L-17 -19 L-11 -13Z" fill="#f2b79b"/>
    <circle cx="-12" cy="-3" r="2.2" fill="#2b2018"/>
    <circle cx="-12.6" cy="-3.6" r=".7" fill="#fff"/>
  </g>
  <!-- lone racer on the other side -->
  <g transform="translate(686 300)" opacity=".92">
    <path d="M0-30 C9-30 14-13 16 0 L-16 0 C-14-13 -9-30 0-30Z" fill="#39434f"/>
    <circle cx="0" cy="-36" r="7" fill="#b9a48f"/>
    <path d="M-12-16 L-30-4 M12-16 L30-24" stroke="#b9a48f" stroke-width="4" stroke-linecap="round"/>
  </g>
  <rect width="800" height="450" fill="url(#plateVignette)" pointer-events="none"/>
</svg>
