<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Villagers haul timber planks across a broken stone bridge while a wayfinder watches from the near bank">
  <defs>
    <radialGradient id="plateVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#0c1320" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c1320" stop-opacity="0.28"/>
    </radialGradient>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dfe6d8"/><stop offset="1" stop-color="#9db3a6"/></linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7d9b7f"/><stop offset="1" stop-color="#4d6b54"/></linearGradient>
    <linearGradient id="chasm" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#66756d"/><stop offset=".55" stop-color="#334440"/><stop offset="1" stop-color="#1b2a2a"/></linearGradient>
    <radialGradient id="sun"><stop stop-color="#fff7d8" stop-opacity=".9"/><stop offset="1" stop-color="#fff0b8" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- sky and distant hills -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="652" cy="92" r="54" fill="url(#sun)" opacity=".55"/>
  <circle cx="652" cy="92" r="22" fill="#f7e7b4" opacity=".8"/>
  <path d="M0 204 Q130 164 250 198 T520 184 T800 202 V302 H0Z" fill="#94ad9d" opacity=".75"/>
  <path d="M0 244 Q170 212 330 240 T650 228 T800 246 V320 H0Z" fill="#708e79"/>

  <!-- solid banks on BOTH sides -->
  <path d="M0 296 Q160 272 280 292 V450 H0Z" fill="url(#land)"/>
  <path d="M520 292 Q660 270 800 296 V450 H520Z" fill="url(#land)"/>
  <g stroke="#3d5a43" stroke-width="3" stroke-linecap="round" opacity=".7">
    <path d="M60 320 l6 -12 M66 320 l10 -8 M150 336 l6 -12 M156 336 l10 -8 M690 330 l6 -12 M696 330 l10 -8"/>
  </g>

  <!-- the gap itself: a narrow chasm, widening toward the viewer -->
  <path d="M258 296 L542 296 L578 450 L222 450Z" fill="url(#chasm)"/>
  <path d="M262 300 L538 300" stroke="#3b4a44" stroke-width="4" opacity=".8"/>
  <g fill="#d5e0d5" opacity=".22">
    <path d="M290 336 Q400 320 510 336 Q400 352 290 336Z"/>
    <path d="M268 392 Q400 372 532 392 Q400 412 268 392Z"/>
  </g>
  <g fill="#25332f" opacity=".8">
    <path d="M330 438 l22 -20 l26 20Z"/><path d="M420 444 l26 -22 l28 22Z"/>
  </g>

  <!-- stone abutments holding the broken span -->
  <g fill="#a3a598" stroke="#696d61" stroke-width="2.5">
    <path d="M176 296 H262 L274 320 L184 320Z"/>
    <path d="M184 320 H274 L264 358 L190 358Z"/>
    <path d="M538 296 H624 V320 H526Z"/>
    <path d="M526 320 H616 V358 H536Z"/>
  </g>
  <g stroke="#7e8276" stroke-width="2" opacity=".7">
    <path d="M198 296 V358 M228 296 V358 M580 296 V358 M606 296 V358"/>
  </g>

  <!-- the two broken ends of the old bridge, with a clear gap between them -->
  <g fill="#6d5a43" stroke="#4e3e2e" stroke-width="2">
    <path d="M262 286 L356 304 L352 314 L260 298Z"/>
    <path d="M538 284 L452 302 L456 312 L540 296Z"/>
  </g>
  <g stroke="#8a7254" stroke-width="2" opacity=".8">
    <path d="M272 290 L348 306 M528 288 L460 304"/>
  </g>

  <!-- fresh timber planks being hauled across the gap -->
  <g fill="#bd8f57" stroke="#74502f" stroke-width="2.5">
    <rect x="296" y="322" width="208" height="14" rx="3"/>
    <rect x="296" y="342" width="208" height="14" rx="3"/>
    <rect x="296" y="362" width="208" height="14" rx="3"/>
  </g>
  <g stroke="#e8d6ae" stroke-width="3" fill="none">
    <path d="M250 306 Q276 336 300 344"/>
    <path d="M550 306 Q524 336 500 344"/>
  </g>

  <!-- villagers, safely on the banks, pulling the ropes -->
  <g>
    <g transform="translate(214 300)">
      <ellipse cy="3" rx="17" ry="5" fill="#000" opacity=".2"/>
      <path d="M0-34 C11-34 16-15 18 0 L-18 0 C-16-15 -11-34 0-34Z" fill="#4e6d86"/>
      <circle cx="0" cy="-40" r="7.5" fill="#d9a87e"/>
      <path d="M14-26 L34-32" stroke="#d9a87e" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(132 316)">
      <ellipse cy="3" rx="16" ry="4" fill="#000" opacity=".2"/>
      <path d="M0-30 C9-30 14-13 16 0 L-16 0 C-14-13 -9-30 0-30Z" fill="#8d6a48"/>
      <circle cx="0" cy="-36" r="7" fill="#d9a87e"/>
      <path d="M12-22 L30-28" stroke="#d9a87e" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(606 300)">
      <ellipse cy="3" rx="17" ry="5" fill="#000" opacity=".2"/>
      <path d="M0-34 C11-34 16-15 18 0 L-18 0 C-16-15 -11-34 0-34Z" fill="#77875c"/>
      <circle cx="0" cy="-40" r="7.5" fill="#d9a87e"/>
      <path d="M-14-26 L-34-32" stroke="#d9a87e" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(684 316)">
      <ellipse cy="3" rx="16" ry="4" fill="#000" opacity=".2"/>
      <path d="M0-30 C9-30 14-13 16 0 L-16 0 C-14-13 -9-30 0-30Z" fill="#6a5c7c"/>
      <circle cx="0" cy="-36" r="7" fill="#d9a87e"/>
      <path d="M-12-22 L-30-28" stroke="#d9a87e" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- wayfinder on the near bank -->
  <g transform="translate(180 300)"><ellipse cy="3" rx="16" ry="4" fill="#000" opacity=".2"/><path d="M0-32 C10-32 15-14 17 0 L-17 0 C-15-14 -10-32 0-32Z" fill="#3f6079"/><circle cx="0" cy="-38" r="7" fill="#d9a87e"/><path d="M14-24 L32-32" stroke="#d9a87e" stroke-width="5" stroke-linecap="round"/></g>
  <rect width="800" height="450" fill="url(#plateVignette)" pointer-events="none"/>
</svg>
