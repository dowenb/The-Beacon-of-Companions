<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A lone wayfinder races up the final spiral stair carrying the torch">
  <defs>
    <radialGradient id="plateVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#0c1320" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c1320" stop-opacity="0.28"/>
    </radialGradient>

    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5a5346"/><stop offset="1" stop-color="#2e2d2f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ffd989" stop-opacity=".75"/><stop offset="1" stop-color="#f0a94e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#wall)"/>
  <!-- spiral stairwell -->
  <path d="M0 90 Q400 30 800 130 V170 Q400 70 0 130Z" fill="#453f36" opacity=".9"/>
  <path d="M0 190 Q400 130 800 230 V270 Q400 170 0 230Z" fill="#403a32" opacity=".9"/>
  <path d="M0 300 Q400 240 800 340 V380 Q400 280 0 340Z" fill="#39342e" opacity=".9"/>
  <!-- central pillar -->
  <ellipse cx="400" cy="450" rx="92" ry="70" fill="#4a4338"/>
  <ellipse cx="400" cy="430" rx="92" ry="34" fill="#5b5346"/>
  <!-- the torch -->
  <g transform="translate(330 300)">
    <circle r="86" fill="url(#glow)"/>
    <path d="M0 8 L60 -46" stroke="#7a5432" stroke-width="9" stroke-linecap="round"/>
    <path d="M58 -48 Q46 -74 60 -92 Q66 -76 74 -84 Q82 -66 68 -44Z" fill="#f6a94b"/>
    <path d="M60 -50 Q54 -68 64 -80 Q72 -66 70 -50Z" fill="#ffe09a"/>
  </g>
  <g>
  </g>
  <!-- lone racer on the other side -->
  <g transform="translate(686 300)" opacity=".92">
    <path d="M0-30 C9-30 14-13 16 0 L-16 0 C-14-13 -9-30 0-30Z" fill="#39434f"/>
    <circle cx="0" cy="-36" r="7" fill="#b9a48f"/>
    <path d="M-12-16 L-30-4 M12-16 L30-24" stroke="#b9a48f" stroke-width="4" stroke-linecap="round"/>
  </g>
  <rect width="800" height="450" fill="url(#plateVignette)" pointer-events="none"/>
</svg>
