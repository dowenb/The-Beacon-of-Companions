<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A wayfinder and their fox scout stand at the railing of the cold beacon chamber">
  <defs>
    <radialGradient id="plateVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#0c1320" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c1320" stop-opacity="0.28"/>
    </radialGradient>

    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#16213c"/><stop offset="1" stop-color="#3b4a6b"/></linearGradient>
    <linearGradient id="valley" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4a5872"/><stop offset="1" stop-color="#202b40"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#night)"/>
  <circle cx="126" cy="80" r="28" fill="#dfe6ff" opacity=".85"/>
  <g fill="#fff" opacity=".7">
    <circle cx="250" cy="60" r="1.6"/><circle cx="330" cy="110" r="1.3"/><circle cx="470" cy="52" r="1.8"/>
    <circle cx="570" cy="96" r="1.2"/><circle cx="690" cy="48" r="1.6"/><circle cx="740" cy="120" r="1.3"/>
  </g>
  <!-- valley below -->
  <path d="M0 300 Q160 262 320 296 T640 282 T800 300 V450 H0Z" fill="url(#valley)"/>
  <g fill="#0f1728" opacity=".8">
    <path d="M30 344 l26-18 l26 18Z"/><path d="M110 366 l22-16 l22 16Z"/><path d="M210 340 l28-20 l28 20Z"/>
    <path d="M330 372 l24-16 l24 16Z"/><path d="M430 346 l26-18 l26 18Z"/><path d="M540 370 l24-16 l24 16Z"/>
    <path d="M650 342 l28-20 l28 20Z"/><path d="M740 368 l22-16 l22 16Z"/>
  </g>
  <!-- tower chamber foreground -->
  <path d="M0 450 V372 Q0 340 44 336 H756 Q800 340 800 372 V450Z" fill="#4c4a45" stroke="#30302e" stroke-width="3"/>
  <path d="M0 392 H800" stroke="#383632" stroke-width="3" opacity=".7"/>
  <!-- railing -->
  <g stroke="#2c2c2b" stroke-width="7" stroke-linecap="round">
    <path d="M40 336 V300 M160 334 V302 M280 334 V302 M520 334 V302 M640 334 V302 M760 336 V300"/>
    <path d="M30 306 H770" stroke-width="5"/>
  </g>
  <!-- torch cradle -->
  <g transform="translate(400 356)">
    <path d="M-34 18 Q0 -6 34 18Z" fill="#6e6a5e" stroke="#44423c" stroke-width="3"/>
    <path d="M-16 18 V38 M16 18 V38" stroke="#5b584f" stroke-width="8"/>
    <ellipse cy="14" rx="20" ry="6" fill="#302d28"/>
  </g>
  <!-- wayfinder holding torch -->
  <g transform="translate(400 336)">
    <ellipse cy="3" rx="20" ry="5" fill="#000" opacity=".3"/>
    <path d="M0-34 C12-34 17-15 20 0 L-20 0 C-17-15 -12-34 0-34Z" fill="#3f6079"/>
    <circle cx="0" cy="-40" r="8" fill="#d9a87e"/>
    <path d="M-9-42 Q0-54 9-42 L9-38 Q0-46 -9-38Z" fill="#2d4659"/>
    <path d="M14-22 L34-40" stroke="#d9a87e" stroke-width="6" stroke-linecap="round"/>
    <path d="M30-42 L40-56" stroke="#7a5432" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- waiting companion silhouettes -->
  <g fill="#202b3b" opacity=".9">
    <g data-party="friends" transform="translate(250 336)"><path d="M0-30 C9-30 14-13 16 0 L-16 0 C-14-13 -9-30 0-30Z"/><circle cx="0" cy="-36" r="7"/></g>
    <g data-party="friends" transform="translate(304 336)"><path d="M0-28 C8-28 12-12 14 0 L-14 0 C-12-12 -8-28 0-28Z"/><circle cx="0" cy="-34" r="6.5"/></g>
  </g>
  <rect width="800" height="450" fill="url(#plateVignette)" pointer-events="none"/>
</svg>
