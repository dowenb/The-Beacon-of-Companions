<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A joyful circle of friends celebrates around a blazing beacon as the valley rebuilds at sunrise">
  <defs>
    <radialGradient id="plateVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#0c1320" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c1320" stop-opacity="0.28"/>
    </radialGradient>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffd9a0"/><stop offset=".5" stop-color="#f6b478"/><stop offset="1" stop-color="#a8c6b4"/></linearGradient>
    <radialGradient id="flame"><stop stop-color="#fff3c4" stop-opacity=".95"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="112" cy="92" r="44" fill="#fff2c8" opacity=".95"/>
  <path d="M0 244 Q140 204 280 238 T560 222 T800 242 V450 H0Z" fill="#8fb39a" opacity=".8"/>
  <path d="M0 290 Q200 258 400 288 T800 276 V450 H0Z" fill="#6a9579"/>
