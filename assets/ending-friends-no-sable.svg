    <g transform="translate(292 414)"><ellipse cy="3" rx="17" ry="5" fill="#000" opacity=".2"/><path d="M0-32 C10-32 15-14 17 0 L-17 0 C-15-14 -10-32 0-32Z" fill="#8a6a49"/><circle cx="0" cy="-38" r="7" fill="#e0b189"/></g>
    <g transform="translate(510 414)"><ellipse cy="3" rx="17" ry="5" fill="#000" opacity=".2"/><path d="M0-32 C10-32 15-14 17 0 L-17 0 C-15-14 -10-32 0-32Z" fill="#77875c"/><circle cx="0" cy="-38" r="7" fill="#e0b189"/></g>
