  <g fill="#ffd36b" opacity=".9"><circle cx="240" cy="150" r="3"/><circle cx="590" cy="130" r="3"/><circle cx="300" cy="90" r="3"/></g>
  <rect width="800" height="450" fill="url(#plateVignette)" pointer-events="none"/>
