    <g fill="#ffd98a"><rect x="56" y="318" width="14" height="14"/><rect x="636" y="326" width="14" height="14"/><rect x="712" y="334" width="12" height="12"/></g>
    <path d="M196 344 Q240 330 280 344 M520 342 Q564 328 604 342" stroke="#7aa46f" stroke-width="8" fill="none" opacity=".8"/>
