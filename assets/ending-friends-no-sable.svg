  <path d="M400 188 Q374 140 396 96 Q412 132 422 104 Q442 148 416 188Z" fill="#ffd36b"/>
  <path d="M400 186 Q388 150 402 122 Q416 150 410 186Z" fill="#fff3c4"/>
