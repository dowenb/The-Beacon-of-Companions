<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="A wayfinder and their fox scout face the beacon tower gate, weighing the iron wheel against a small side latch">
  <defs>
    <radialGradient id="plateVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#0c1320" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c1320" stop-opacity="0.28"/>
    </radialGradient>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2b3c60"/><stop offset="1" stop-color="#54627d"/></linearGradient>
    <radialGradient id="torch"><stop stop-color="#ffe2a0" stop-opacity=".8"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="686" cy="74" r="24" fill="#e6ecff" opacity=".85"/>
  <path d="M0 268 L150 180 L280 260 L420 156 L560 258 L800 176 V450 H0Z" fill="#2f4051" opacity=".85"/>
  <!-- tower wall -->
  <path d="M150 450 V190 Q150 150 200 150 H600 Q650 150 650 190 V450Z" fill="#6d716e" stroke="#4f544f" stroke-width="3"/>
  <g stroke="#585d58" stroke-width="2" opacity=".6">
    <path d="M150 240 H650 M150 310 H650 M150 380 H650"/>
    <path d="M250 150 V240 M400 150 V240 M550 150 V240 M200 240 V310 M330 240 V310 M470 240 V310 M600 240 V310"/>
  </g>
  <!-- great iron gate -->
  <circle cx="400" cy="330" r="108" fill="#3b4247" stroke="#252b30" stroke-width="8"/>
  <circle cx="400" cy="330" r="84" fill="none" stroke="#7f8a88" stroke-width="10"/>
  <circle cx="400" cy="330" r="30" fill="#8b938e" stroke="#4c5552" stroke-width="5"/>
  <g stroke="#8b938e" stroke-width="8" stroke-linecap="round">
    <path d="M400 300 V246 M400 360 V414 M370 330 H316 M430 330 H484"/>
    <path d="M379 309 L341 271 M421 351 L459 389 M421 309 L459 271 M379 351 L341 389"/>
  </g>
  <circle cx="400" cy="330" r="10" fill="#d9c07a"/>
  <!-- side latch -->
  <rect x="520" y="316" width="34" height="12" rx="3" fill="#c9a45c" stroke="#7d6438" stroke-width="2"/>
  <circle cx="537" cy="322" r="4" fill="#5e4c2c"/>
  <!-- torch glow -->
  <circle cx="150" cy="330" r="70" fill="url(#torch)"/>
  <path d="M146 340 Q136 316 146 300 Q152 314 158 300 Q166 322 154 340Z" fill="#f2a447"/>
  <path d="M140 344 H162" stroke="#6d4a2b" stroke-width="6" stroke-linecap="round"/>
  <!-- companions pushing the wheel -->
  <g>
    <g transform="translate(400 236)"><ellipse cy="3" rx="15" ry="4" fill="#000" opacity=".25"/><path d="M0-30 C9-30 14-13 16 0 L-16 0 C-14-13 -9-30 0-30Z" fill="#3f6079"/><circle cx="0" cy="-36" r="7" fill="#d9a87e"/><path d="M0-22 V-6" stroke="#d9a87e" stroke-width="5" stroke-linecap="round"/></g>
    <g data-party="friends" transform="translate(306 268)"><ellipse cy="3" rx="15" ry="4" fill="#000" opacity=".25"/><path d="M0-28 C8-28 12-12 14 0 L-14 0 C-12-12 -8-28 0-28Z" fill="#8a6a49"/><circle cx="0" cy="-34" r="6.5" fill="#d9a87e"/></g>
    <g data-party="friends" transform="translate(494 268)"><ellipse cy="3" rx="15" ry="4" fill="#000" opacity=".25"/><path d="M0-28 C8-28 12-12 14 0 L-14 0 C-12-12 -8-28 0-28Z" fill="#5e7086"/><circle cx="0" cy="-34" r="6.5" fill="#d9a87e"/></g>
  </g>
  <!-- Pip at the latch -->
  <g data-party="pip" transform="translate(566 316)">
    <ellipse cx="0" cy="14" rx="25" ry="4" fill="#000" opacity=".2"/>
    <path d="M-12 6 V14 M-2 6 V14 M8 6 V14" stroke="#a85c31" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M10 2 Q26 -4 31 -20 Q35 -8 27 3 Q20 10 9 8Z" fill="#cf753f"/>
    <path d="M31 -20 Q35 -8 27 3 Q32 -9 31 -20Z" fill="#f7e8d2"/>
    <ellipse cx="-2" cy="2" rx="15" ry="8" fill="#d88049"/>
    <path d="M-13 5 Q-2 12 10 5 Q-2 10 -13 5Z" fill="#f5dfc2"/>
    <path d="M-18 -6 Q-11 -14 -2 -10 Q4 -5 2 2 Q-3 8 -12 6 Q-20 2 -18 -6Z" fill="#dc874f"/>
    <path d="M-18 -2 Q-27 -1 -31 3 Q-25 8 -16 6Z" fill="#efad7b"/>
    <circle cx="-31" cy="3" r="2" fill="#2b2018"/>
    <path d="M-16 -10 L-19 -23 L-8 -12Z" fill="#b96435"/>
    <path d="M-6 -12 L-2 -23 L5 -10Z" fill="#b96435"/>
    <path d="M-16 -12 L-17 -19 L-11 -13Z" fill="#f2b79b"/>
    <circle cx="-12" cy="-3" r="2.2" fill="#2b2018"/>
    <circle cx="-12.6" cy="-3.6" r=".7" fill="#fff"/>
  </g>
  <rect width="800" height="450" fill="url(#plateVignette)" pointer-events="none"/>
</svg>
